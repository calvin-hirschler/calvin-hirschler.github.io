<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calvin Hirschler - Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="games.html">Games</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <main>
        <h2>Games</h2>
        
        <div class="content-box">
            <h3>2D Unity Roguelike</h3>
            <p class="date">07/2022 - Present</p>
            <div class="media-placeholder">[Image/Video Placeholder]</div>
            <p>Directed a two-year project featuring 24 unique enemies and over 40 weapons.</p>
        </div>
    </main>

    <script>
        const glitchElements = document.querySelectorAll('.content-box');
        
        glitchElements.forEach(el => {
            el.addEventListener('mouseenter', () => {
                el.style.animation = 'none';
                void el.offsetWidth; 
                el.style.animation = `glitch-box 0.4s ease-out forwards`;
            });
            
            el.addEventListener('mouseleave', () => {
                el.style.animation = 'none';
            });
        });
    </script>
</body>
</html>
